name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Platform Folders & Build APK
        working-directory: ./flutter_app
        run: |
          flutter config --enable-android
          flutter create --platforms=android .
          flutter pub get
          dart run flutter_launcher_icons
          sed -i 's/android:label="robotic_controller"/android:label="First team"/g' android/app/src/main/AndroidManifest.xml
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Robotic-Controller-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
